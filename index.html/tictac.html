<!-- tic-tac-toe.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        #status {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            user-select: none;
        }

        .cell:hover {
            background: #444;
        }

        .cell.taken {
            cursor: default;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00ff99;
            border: none;
            color: #000;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #00cc77;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div id="status">Player X's turn</div>
    <div class="board" id="board"></div>
    <button onclick="resetGame()">Restart Game</button>

    <script>
        const board = document.getElementById('board');
        const statusText = document.getElementById('status');
        let currentPlayer = 'X'; // Player X starts
        let cells = [];
        let gameOver = false;

        function createBoard() {
            board.innerHTML = '';
            cells = [];
            gameOver = false;
            statusText.textContent = "Player X's turn";
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.addEventListener('click', () => handlePlayerMove(i));
                board.appendChild(cell);
                cells.push(cell);
            }
        }

        function handlePlayerMove(index) {
            if (cells[index].textContent || gameOver || currentPlayer !== 'X') return;

            cells[index].textContent = 'X';
            cells[index].classList.add('taken');

            if (checkWinner('X')) {
                statusText.textContent = `Player X wins! 🎉`;
                gameOver = true;
                return;
            }

            if (cells.every(cell => cell.textContent)) {
                statusText.textContent = "It's a draw!";
                gameOver = true;
                return;
            }

            currentPlayer = 'O';
            statusText.textContent = "Computer's turn";
            setTimeout(computerMove, 500); // Delay to simulate thinking time
        }

        function computerMove() {
            if (gameOver || currentPlayer !== 'O') return;

            let emptyCells = [];
            for (let i = 0; i < cells.length; i++) {
                if (!cells[i].textContent) {
                    emptyCells.push(i);
                }
            }

            // Randomly pick an available cell
            const randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            cells[randomIndex].textContent = 'O';
            cells[randomIndex].classList.add('taken');

            if (checkWinner('O')) {
                statusText.textContent = `Computer wins! 🎉`;
                gameOver = true;
                return;
            }

            if (cells.every(cell => cell.textContent)) {
                statusText.textContent = "It's a draw!";
                gameOver = true;
                return;
            }

            currentPlayer = 'X';
            statusText.textContent = "Player X's turn";
        }

        function checkWinner(player) {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            return wins.some(combo =>
                combo.every(index => cells[index].textContent === player)
            );
        }

        function resetGame() {
            currentPlayer = 'X';
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
